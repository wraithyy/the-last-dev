[workspace]
resolver = "3"
members = ["crates/combat_core", "crates/game_client", "crates/net_proto", "crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Bevy is slow in debug; optimize dependencies but keep our own code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Dependency debuginfo cost ~7 GB of target/ with no debugging value for us.
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = true
