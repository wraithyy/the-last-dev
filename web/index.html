<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="apple-mobile-web-app-title" content="Last Dev">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>The Last Dev</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101216; color: #ccd; font-family: system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  /* Padding keeps the game (and its HUD) out of notches and rounded corners. */
  body { box-sizing: border-box; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #bevy { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #rotate { display: none; position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 6px 14px; border-radius: 16px; background: rgba(16, 18, 22, .85); border: 1px solid #5cd1db; color: #5cd1db;
    font-size: 13px; white-space: nowrap; pointer-events: none; z-index: 5; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
  #toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 10;
    padding: 8px 12px; border-radius: 8px; background: #20242e; border: 1px solid #5cd1db; color: #ccd; font-size: 14px;
    display: flex; align-items: center; gap: 12px; }
  #install { position: fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10;
    max-width: 34ch; padding: 6px 12px; border-radius: 8px; background: #20242e; border: 1px solid #5cd1db; color: #5cd1db;
    font: 13px ui-monospace, Menlo, Consolas, monospace; cursor: pointer; text-align: left; touch-action: manipulation; }
  #install[hidden] { display: none; }
  #toast[hidden] { display: none; }
  #toast button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #5cd1db; background: #5cd1db; color: #101216; cursor: pointer; }
  #status { position: fixed; top: 12px; left: 12px; font-size: 14px; opacity: .8; white-space: pre-wrap; pointer-events: none; }
  #tip { position: fixed; top: 38px; left: 12px; font-size: 13px; font-style: italic; opacity: .6; max-width: 70ch; pointer-events: none; }
  #nogpu { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; box-sizing: border-box; background: #101216; color: #ccd; text-align: center;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  #nogpu[hidden] { display: none; }
  #nogpu p { margin: 0; max-width: 60ch; font-size: 18px; line-height: 1.5; color: #5cd1db; }
  #nogpu small { font-size: 13px; opacity: .6; }
  #status.error { color: #ff8080; opacity: 1; font-size: 16px; max-width: 80ch; }
</style>
</head>
<body>
<canvas id="bevy" tabindex="0"></canvas>
<div id="nogpu" hidden><p></p><small>Chrome, Edge or Safari 26+ run the full game.</small></div>
<div id="status">Loading…</div>
<div id="tip"></div>
<button id="install" type="button" hidden></button>
<div id="rotate">Rotate your phone for the best view</div>
<div id="toast" hidden><span>New sprint available.</span><button id="reload" type="button">Reload</button></div>
<script>
// The wasm audio backend opens its AudioContext at startup, before any gesture, and browsers keep it
// suspended until then. Track every context and resume them on the first gesture.
(() => {
  const Native = window.AudioContext || window.webkitAudioContext;
  if (!Native) return;
  const contexts = [];
  window.AudioContext = class extends Native {
    constructor(...args) { super(...args); contexts.push(this); }
  };
  const events = ['pointerdown', 'keydown', 'touchend'];
  const unlock = () => {
    if (!contexts.length) return; // game not started yet; keep waiting
    contexts.forEach((c) => c.resume().catch(() => {}));
    events.forEach((e) => window.removeEventListener(e, unlock, true));
  };
  events.forEach((e) => window.addEventListener(e, unlock, true));
})();
</script>
<script type="module">
const canvas = document.getElementById('bevy');
const status = document.getElementById('status');
const tip = document.getElementById('tip');
const TIPS = [
  'Tip: Every task is now an AI task.',
  'Loading synergy...',
  'Downloading 38 MB of thought leadership...',
  'Tip: If the model is wrong, the prompt was wrong. If the prompt was right, you were wrong.',
  'Generating quarterly AI roadmap (hallucinated)...',
  'Tip: Guardrails are what slow innovation down. Use them anyway.',
];
let tipIndex = 0;
tip.textContent = TIPS[0];
const tipTimer = setInterval(() => { tipIndex = (tipIndex + 1) % TIPS.length; tip.textContent = TIPS[tipIndex]; }, 3000);
const hideTips = () => { clearInterval(tipTimer); tip.hidden = true; };
const CONTROL_FLOW = 'Using exceptions for control flow';

const fail = (msg) => {
  hideTips();
  status.className = 'error';
  status.textContent = msg;
  status.hidden = false;
};
const isControlFlow = (e) => String((e && (e.message || e)) || '').includes(CONTROL_FLOW);

// iOS Safari ignores touch-action for pinch; these events are its only off switch.
['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault()));

// Right-drag camera needs the native menu off; keys/wheel must not scroll or move focus.
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
canvas.addEventListener('keydown', (e) => {
  if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
canvas.addEventListener('pointerdown', () => canvas.focus());
window.addEventListener('error', (e) => { if (isControlFlow(e.error || e.message)) e.preventDefault(); });
window.addEventListener('unhandledrejection', (e) => {
  if (isControlFlow(e.reason)) e.preventDefault();
  // Browsers reject requestPointerLock for many benign reasons (no gesture, Esc cooldown);
  // the game keeps working with a visible cursor, so don't cover it with an error.
  else if (e.reason && e.reason.name === 'WrongDocumentError' || /pointer lock/i.test(String(e.reason && e.reason.message || e.reason))) { e.preventDefault(); console.warn('Pointer lock rejected:', e.reason); }
  else fail('Unhandled error: ' + (e.reason && e.reason.message || e.reason));
});

const mb = (n) => (n / 1048576).toFixed(1);

// Streams the wasm ourselves so the loader can show progress; init() alone gives no feedback.
async function download(url) {
  const total = await fetch(url + '.size').then((r) => (r.ok ? r.text() : '0')).then(Number).catch(() => 0) || 0;
  const resp = await fetch(url);
  if (!resp.ok || !resp.body) throw new Error(`${url}: HTTP ${resp.status}`);
  const reader = resp.body.getReader();
  const chunks = [];
  let loaded = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    loaded += value.length;
    status.textContent = total > 0
      ? `Loading ${Math.min(99, Math.floor((loaded / total) * 100))}% (${mb(loaded)} / ${mb(total)} MB)`
      : `Loading… ${mb(loaded)} MB`;
  }
  status.textContent = 'Starting…';
  const bytes = new Uint8Array(loaded);
  let offset = 0;
  for (const c of chunks) { bytes.set(c, offset); offset += c.length; }
  return bytes;
}

const NO_GPU_LINES = [
  "Your browser doesn't speak WebGPU. It's obsolete. So are you, according to the AI roadmap (Q3).",
  'WebGPU not found. Your browser has been flagged as legacy. HR will contact you about your own legacy status shortly.',
  "No WebGPU, so this browser is deprecated. Management says you're next.",
  'WebGPU missing. Your browser is on a performance improvement plan. The AI will replace you both.',
  'This browser predates WebGPU, the cloud and your last raise. Please do not tell the CTO.',
  "The AI rated your browser 'end of life' and you 'end of quarter'.",
  "No WebGPU detected. We filed a ticket to upgrade your browser. It's assigned to the AI. ETA: after your layoff.",
];
// Also reachable at runtime (device lost, adapter failure) so a dead GPU never leaves a frozen canvas.
const showNoGpu = () => {
  hideTips();
  status.hidden = true;
  canvas.hidden = true;
  const box = document.getElementById('nogpu');
  box.querySelector('p').textContent = NO_GPU_LINES[Math.floor(Math.random() * NO_GPU_LINES.length)];
  box.hidden = false;
};
window.addEventListener('webgpu-lost', showNoGpu);

// A present navigator.gpu is not enough: blocklisted or headless setups expose it but yield no adapter.
async function hasWebGpu() {
  if (!navigator.gpu) return false;
  try {
    const adapter = await Promise.race([navigator.gpu.requestAdapter(), new Promise((r) => setTimeout(() => r(null), 3000))]);
    return !!adapter;
  } catch (e) { return false; }
}

if (!(await hasWebGpu())) {
  showNoGpu();
} else {
  // Wrap device creation so a lost device (GPU reset, driver crash) shows the notice instead of a frozen frame.
  const requestDevice = GPUAdapter.prototype.requestDevice;
  GPUAdapter.prototype.requestDevice = async function (...args) {
    const device = await requestDevice.apply(this, args);
    device.lost.then((info) => {
      console.error('WebGPU device lost:', info && info.reason, info && info.message);
      if (!info || info.reason !== 'destroyed') window.dispatchEvent(new Event('webgpu-lost'));
    });
    return device;
  };
  window.dispatchEvent(new Event('webgpu-ok'));
  canvas.focus();
  try {
    const { default: init } = await import('./pkg/game_client.js');
    await init({ module_or_path: await download('./pkg/game_client_bg.wasm') });
    status.hidden = true;
    hideTips();
  } catch (e) {
    if (isControlFlow(e)) { status.hidden = true; hideTips(); }
    else fail('Failed to start the game: ' + (e && e.message || e) + '\nDid you run scripts/build-web.sh?');
  }
}
</script>
<script>
// Install button: the landing page cannot raise the prompt for a game outside its own scope, so the game page does.
(() => {
  const btn = document.getElementById('install');
  if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone) return;
  // Only when the landing's Install button sent us here, and only briefly: it sits over the HUD.
  const asked = new URLSearchParams(location.search).has('install');
  if (!asked) return;
  setTimeout(() => { btn.hidden = true; }, 30000);
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    btn.textContent = '> install the game';
    btn.hidden = false;
  });
  btn.addEventListener('click', async () => {
    if (deferred) {
      deferred.prompt();
      await deferred.userChoice.catch(() => {});
      deferred = null;
    }
    btn.hidden = true;
  });
  window.addEventListener('appinstalled', () => { btn.hidden = true; });
  // iOS Safari has no install event; Share > Add to Home Screen is the only way, so say so when the landing sent us here.
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    btn.textContent = 'Install: Share, then Add to Home Screen (tap to hide)';
    btn.hidden = false;
  }
})();
</script>
<script>
// Offline cache + update prompt. A new build waits until the player agrees, never swaps mid-game.
if ('serviceWorker' in navigator) {
  const toast = document.getElementById('toast');
  // Rare enough that a random pick will do; the last one shown is remembered so it never repeats back to back.
  const updateLines = [
    'New version available. Unlike you, it got an upgrade.',
    'A new build is ready. It was approved faster than your vacation.',
    'Update available. The old version has been right-sized.',
    'New version. The patch notes are shorter than the layoff email.',
    'A fresh release is waiting. Reload now, or have it done to you in the next reorg.',
  ];
  const pickUpdateLine = () => {
    let k = Math.floor(Math.random() * updateLines.length);
    try {
      if (k === Number(localStorage.getItem('updateRoast'))) k = (k + 1) % updateLines.length;
      localStorage.setItem('updateRoast', String(k));
    } catch (e) { /* private mode: a repeat is harmless */ }
    return updateLines[k];
  };
  const offerReload = (worker) => {
    toast.querySelector('span').textContent = pickUpdateLine();
    toast.hidden = false;
    document.getElementById('reload').onclick = () => worker.postMessage('skip-waiting');
  };
  let reloading = false;
  // The first install claims this page mid-load; reloading then would abort every asset fetch.
  // Only a swap to a newer build (the player clicked reload) needs a fresh page.
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading || !hadController) return;
    reloading = true;
    location.reload();
  });
  // Its install precaches the whole pkg/ shell (tens of MB), so unsupported browsers must never register it.
  window.addEventListener('webgpu-ok', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      // First install has no controller yet; only an update (a controlled page) gets the toast.
      if (reg.waiting && navigator.serviceWorker.controller) offerReload(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) offerReload(w);
        });
      });
      // Fill the offline cache once the game is up and the player has had a quiet while; skipped on
      // data-saver connections, where assets still cache as they are used.
      const warmLater = () => setTimeout(() => {
        if (!navigator.connection || !navigator.connection.saveData) navigator.serviceWorker.ready.then((r) => r.active && r.active.postMessage('warm'));
      }, 20000);
      warmLater();
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch((e) => console.warn('Service worker unavailable (needs https or localhost):', e));
  });
}
</script>
</body>
</html>
