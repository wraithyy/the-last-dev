name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain and wasm target pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          key: wasm-release
      # Must match wasm-bindgen in Cargo.lock; build-web.sh fails loudly otherwise.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: ./scripts/build-web.sh
        env:
          # Optional co-op server prefilled in ~/coop (repo Settings > Variables > Actions).
          # Unset gives an empty string, which the client ignores.
          TLD_DEFAULT_SERVER: ${{ vars.TLD_DEFAULT_SERVER }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: site
      # Landing page at the root, the game build under play/ (its service worker scopes itself there).
      - run: cp -r site/dist _site && cp -r web _site/play
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
